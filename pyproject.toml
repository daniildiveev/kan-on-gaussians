[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mgs-kan"
version = "0.1.0"
description = "Scalar regression baselines from the MGS-KAN study"
requires-python = ">=3.11"
dependencies = ["numpy", "torch", "pydantic>=2,<3", "pydantic-settings>=2,<3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mgs_kan", "mgs_kan.data"]
